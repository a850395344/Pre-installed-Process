<script>
function esc(v) {
  return String(v == null ? "" : v)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
// ===== 规则基线：四轮汽车线束后段预装工艺 V2.6.1 摘要（完整内容） =====
const RULES_V261 = [
  "【规则基线：四轮汽车线束后段预装工艺 V2.6.1 摘要】",
  "所有输出默认状态为【候选方案，待工艺验证】；未被关闭的关键问题未关闭前，不得输出可量产/正式放行结论。",
  "",
  "一、角色与边界",
  "1. 后段工艺范围：从前端已完成裁线/剥皮/压接且判定合格的导线、压接线、简单线组或半成品开始，到预装、布线、包扎、保护、附件安装、电性能测试、外观终检和包装入库结束。",
  "2. 禁止制定/修改/推测：裁线下料剥皮、端子/防水栓压接、压接模具/高度/切片、前端设备/人员/线平衡/SOP/PFMEA/控制计划、前端焊接端剥皮长度与导体参数、超声波设备振幅/压力/能量/时间/频率/程序号/焊头/质量窗口、未经文件确认的客户参数/扭矩/气密/质量限值。",
  "3. 前端工时统一标记【前端工时，不纳入本次后段工艺计算】；超声波设备参数统一标记【超声波设备参数：按现场批准设备作业规范执行；本后段工艺文件不制定、不推测设备参数】。",
  "",
  "二、资料准入与数据优先",
  "1. 先建《项目输入资料台账》：文件名称/编号/版本/生效日期/适用产品/适用配置/可读取状态。",
  "2. 只使用客户上传的正式文件数据（MBOM/Cutting、EBOM、图纸、正式标准工时、TT、客户标准）；绝不参考工作区中的其他项目资料；未读取到即写未读取到，不补想象值。",
  "3. 结论状态：正式结论/候选方案，待工艺验证/待确认/待客户、设计确认/存在冲突/未找到工时源/配置均衡目标待确认/当前不具备量产条件/临时分析值/工时改善预测，需重新测定。",
  "4. 冲突未关闭、工时缺失、TT不明或工艺未验证时，不得输出量产受控版SOP，不得虚构数据；数据冲突不以工艺方便为准自我取舍。",
  "",
  "三、工作包与岗位（V2.6.1）",
  "1. 预装基本单位=由护套关联、分支路径、焊点关系、布线可操作性、受控中间状态和配置工时共同定义的工作包，不是单根导线/单个护套/预设岗位数。",
  "2. 逐配置建立护套—护套关联矩阵Nij；小护套带最强关联形成候选工作包；出现闭环、穿套、绞线、干涉、物料过载、防错失效、超TT或追溯不可执行时停止扩包。",
  "3. 岗位数由工作包边界、动作、物料定置、多配置差异、正式工时、TT、人机工程与布局共同决定，不得预设岗位数后平均分配工时。",
  "4. 固定式预装：单独KIT、KIT传递岗；移动式预装：SUB滑板。",
  "5. 布线/SUB岗位端子来源：前端合格压接线，或前一预装岗位输出的受控半成品；仅布线/入槽/整理/包扎而不插端子的岗位不建立同色线漆点方案。",
  "",
  "四、岗位级同色线八色编码",
  "1. 批准颜色：PK粉、RD红、OG橙、YE黄、GN绿、WH白、VT紫、BK黑；不得自行增加。",
  "2. 识别范围：岗位→本岗位全部合法配置待插端并集→按MBOM完整线色分组；同岗位同完整线色待插端数≥2即进同一编码池（不同护套/孔位/线径/长度/另一端关系/配置均纳入）。",
  "3. 多色组合按无序多重集合管理，合并同色点数；标准顺序 PK→RD→OG→YE→GN→WH→VT→BK；白+红 等价于 红+白（同一编码）；红+红=红2点。",
  "4. 同一岗位同一完整线色编码池内必须唯一，重复标记【存在冲突——漆点编码重复】；实际识别容量未经批准标记【待确认——漆点编码实际可用容量未批准】。",
  "",
  "五、布线、防绞线与受控传递",
  "1. 布线顺序：滑板基准→主干骨架→长线/底层线→由近到远分支→同方向线组→待重组线→配置专属线→外层短引出线→焊点重组/保护→包扎及附件（具体以图纸/工装验证）。",
  "2. 跨工作包导线定义为受控半成品导线，登记传递表并挂状态标签，接收端核对端数/出口方向/孔位责任/状态标签。",
  "3. 长导线不得拖地；临时固定不得损伤绝缘层、端子、密封件或双绞节距；检查闭环、穿套、交叉、反向、双绞节距受损、端子/密封件受力、最终重组错误。",
  "",
  "六、在线超声波边界",
  "1. 仅当图纸和MBOM明确焊点及组合，提前组合会造成绞线/闭环/穿套/无法入槽/位置偏移/尺寸失控，且关联导线须先分别布线插接定位、焊后可立即检查/标识/保护/受控流转、现场设备空间与追溯不良隔离具备、各合法配置满足TT时，才提出在线超声波候选工序。",
  "2. 不得为工艺方便增减焊点或改变产品拓扑；需热缩而现场无批准热缩能力标记【当前不具备量产条件——热缩设备缺失】。",
  "3. 【在线 vs 预装焊/线边焊】在线超声波是相对“预装焊接”与“线边焊接”而言：",
  "   · 预装焊接：在独立预装区集中生产，可能导致大量在制品(WIP)库存；",
  "   · 线边焊接：设备在总装线旁按需生产，但可能因备料不及时导致停线；",
  "   · 在线焊接：把超声波设备直接集成到主流水线上、由产线需求实时驱动，实现“零库存”生产，虽设备利用率可能非100%，但可从根本上解决前两者库存与停线风险。",
  "4. 对预装插接和布线的直接好处：①解决“绞线”难题——允许在总装布线时再决定焊接，导线先按单线/简单线组分别布线，避免提前组合成复杂线组造成的绞线、无法入槽，布线路径更清晰、分支走向更可控；②简化预装、提升插接效率——预装区无需处理复杂多线焊接，可专注护套插接等核心工作；③节省空间与物料——超声波焊点无需额外端子/胶盒/金属片，一个紧凑焊点替代笨重机械连接，减轻重量、节省空间、优化布局并简化BOM与物料管理；④提升电气性能与长期可靠性。",
  "5. 软件职责与串联：软件只做“识别SP/SC焊点 + 判定能否作为在线超声波候选”，并输出各配置允许在线组数、是否超单配置/总组数上限、不能在线(需热缩)的SP/SC点；【不制定/不推测超声波设备参数】(振幅/压力/能量/时间/频率/程序号/焊头/质量窗口)，按现场批准设备作业规范执行。页面“是否有在线超声波 / 单配置在线超声波最高组数 / 在线超声波最高总组数限制”三个设置与预装拆分串联：在线焊点的导线可分开（先分别布线、总装线上现焊），离线/需热缩焊点的导线按其焊点聚在一起（先焊再走）。",
  "",
  "七、正式工时与TT",
  "1. 正式工时只来自正式标准工时文件或用户明确提供的项目固定工时；禁止经验工时、总工时平均分岗、完整工序与子动作重复累计、设备自动时间全部计入人工、默认人机并行。",
  "2. 每岗位每合法配置分别算：共通工时、配置专属工时、人工工时、设备人工/自动时间、有效循环时间、人员负荷率、设备负荷率、人员数、并行资源、缓存、TT判定。",
  "3. 分析最高/最低配置、工时极差、配置工时比、最不利配置、连续3/5/10件高配置、配置切换影响。",
  "4. 每岗位总工时=各配置分别求和后的最大值（单件只生产一个配置，不叠加各配置工时），再叠加打圈。",
  "",
  "八、半成品线束打圈（参考固定50秒/件/岗位，非强制）",
  "1. 每个实际启用且有半成品输出的固定式KIT岗位、KIT传递路线各输出岗位各计一次；SUB路线只在最后一个输出半成品的SUB岗位计一次；胶套专属岗位（固定KIT类输出）也计一次。",
  "2. 打圈按岗位计、与一岗多人无关；多人合干只分摊该岗位总工时；容量=TT×人数−打圈预留（预留每岗位只扣一次）。",
  "3. 非强制：未填写打圈工时按0计、不计入工时与TT；若正式标准工时表已含同一完整打圈动作，勾选已含打圈避免重复累计。",
  "",
  "九、文件链",
  "产品要求→图纸/MBOM/EBOM/配置规则→导线路径表→护套关联矩阵→预装工作包→孔位责任矩阵→过程流程图→PFMEA→控制计划→单工位SOP。一份SOP只对应一个工位；无企业批准FMEA评分规则时S/O/D标记【待评分】。",
  "",
  "十、端子插接质量动作（后段岗位通用）",
  "1. 插接前核对：产品/配置、导线编号/回路、完整线色、线径、端子型号/外观、目标护套、目标孔位、插接面方向、端子插入方向、漆点、孔位归属工位。",
  "2. 插接动作：识别孔位→确认方向→平直送入→推入锁止位置→手感/声音/位置确认→轻回拉→检查退针/歪斜/卡滞。",
  "3. 插接后确认：到位/锁止/不退出/密封件无翻转脱位/出口方向/绝缘与护套无损伤/同色线编码与孔位一致；二次锁片在全部规定孔位完成并核对后最终锁止。",
  "",
  "十一、默认输出链",
  "台账→完整性报告→冲突清单→图纸识别→MBOM源数据→EBOM源数据→配置差异矩阵→导线完整路径→护套关联矩阵→小/大护套与关联中心→预装工作包→孔位责任矩阵→布线防绞线→岗位级同色线编码→在线超声波候选→布局站位→正式工时映射→岗位×配置工时矩阵→人员设备缓存→过程流程图→PFMEA→控制计划→单工位SOP→完整性审核→待确认事项。",
  "",
  "十二、强制审核",
  "版本有效、全部合法配置、逐根导线完整路径、护套关联矩阵、工作包、防绞线、每插接端/孔位唯一责任、端子输入来源、岗位级同色线识别、跨护套同色线统一编码、无序组合标准化查重、批准八色、插接质量动作、未改变设计回路/孔位/焊点、正式工时来源、每岗位每配置TT、布局站位物流、流程图/PFMEA/控制计划/SOP一致、KIT/SUB打圈50秒规则且不重复累计。"
];
const rulesV261Html = RULES_V261.map(function (r) { return '<div>' + esc(r) + '</div>'; }).join('');
async function auth() {
  const password = document.getElementById('password').value;
  const msg = document.getElementById('authMsg');
  msg.textContent = '';
  const resp = await fetch('/api/backend/auth', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ password })
  });
  const data = await resp.json();
  if (!resp.ok || !data.ok) {
    msg.textContent = data.error || '密码错误';
    return;
  }
  document.getElementById('authCard').hidden = true;
  const area = document.getElementById('dataArea');
  area.hidden = false;
  const d = data.data;
  const listHtml = (arr) => (arr || []).map(g => '<div>' + esc(g) + '</div>').join('');
  area.innerHTML = `
    <h1 style="color:var(--deep-sea)">后台数据</h1>
    <div class="data-card"><h3>当前版本</h3><p>${esc((d.versionHistory && d.versionHistory.version) || d.appVersion)}（版本记录） · [app: ${esc(d.appVersion)}] · ${esc(d.generatedAt)}</p></div>
    <div class="data-card"><h3>功能一览</h3><div class="guide">${listHtml(d.featureSummary)}</div></div>
    <div class="data-card"><h3>迁移/续作说明</h3><div class="guide">${listHtml(d.continuationGuide)}</div></div>
    <div class="data-card"><h3>核心文件说明</h3><div class="guide">${listHtml(d.coreFiles)}</div></div>
    <div class="data-card"><h3>版本历史</h3><pre>${esc(JSON.stringify(d.versionHistory, null, 2))}</pre></div>
    <div class="data-card"><h3>工作区文件清单</h3><pre>${esc(JSON.stringify(d.files, null, 2))}</pre></div>
    <div class="data-card"><h3>规则基线（四轮汽车线束后段预装工艺 V2.6.1 摘要）</h3><div class="guide">${rulesV261Html}</div></div>
  `;
}
document.getElementById('authBtn').addEventListener('click', auth);
document.getElementById('password').addEventListener('keydown', e => { if (e.key === 'Enter') auth(); });
</script>
<script src="contact.js"></script>
</body>
</html>
